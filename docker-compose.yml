services:
  patient-service-db:
    image: mysql:latest
    container_name: patient-service-db
    networks:
      - internal
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: db
      MYSQL_ROOT_PASSWORD: password
      MYSQL_USER: admin_user
      MYSQL_PASSWORD: password
    volumes:
      - mysql-data:/var/lib/mysql

  kafka:
    image: apache/kafka:latest
    container_name: kafka
    hostname: kafka
    networks:
      - internal
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENERS: 'PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_CLUSTER_ID: 'Mk3OEYBNW5TZmj4NaHq0Cw'
    volumes:
      - kafka-data:/tmp/kraft-combined-logs

  patient-service:
    build:
      context: ./patient-service
      dockerfile: Dockerfile
    container_name: patient-service
    networks:
      - internal
    ports:
      - "4000:4000"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://patient-service-db:3306/db
      SPRING_DATASOURCE_USERNAME: admin_user
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_SQL_INIT_MODE: always
      BILLING_SERVICE_ADDRESS: billing-service
      BILLING_SERVICE_GRPC_PORT: 9091
      GRPC_CLIENT_BILLING_SERVICE_ADDRESS: static://billing-service:9001
      GRPC_CLIENT_BILLING_SERVICE_NEGOTIATION_TYPE: plaintext
    depends_on:
      - patient-service-db
      - billing-service

  billing-service:
    build:
      context: ./billing-service
      dockerfile: Dockerfile
    container_name: billing-service
    networks:
      - internal
    ports:
      - "4001:4001"
      - "9001:9001"
    depends_on:
      - patient-service-db

networks:
  internal:
    name: internal
    driver: bridge

volumes:
  mysql-data:
  kafka-data:
